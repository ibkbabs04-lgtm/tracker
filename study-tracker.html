<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Study Tracker</title>
<style>
:root{
  --bg:#f5f4f0;--card:#ffffff;--fg:#1c1b22;--muted:#6b6a76;--line:#e6e4dd;--soft:#f0eee8;
  --accent:#5b5bd6;--accent-fg:#ffffff;--accent-soft:#ecebfb;
  --good:#1a8f5a;--warn:#c47f00;--bad:#d03f3f;
  --shadow:0 1px 2px rgba(20,18,40,.05),0 6px 20px rgba(20,18,40,.05);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12121a;--card:#1b1b26;--fg:#ecebf3;--muted:#9c9bab;--line:#2a2a38;--soft:#232331;
    --accent:#8e8eff;--accent-fg:#12121a;--accent-soft:#26264a;
    --good:#43c98a;--warn:#e8aa3a;--bad:#f06a6a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#12121a;--card:#1b1b26;--fg:#ecebf3;--muted:#9c9bab;--line:#2a2a38;--soft:#232331;
  --accent:#8e8eff;--accent-fg:#12121a;--accent-soft:#26264a;
  --good:#43c98a;--warn:#e8aa3a;--bad:#f06a6a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--accent) 13%,transparent),transparent 70%),var(--bg);background-attachment:fixed;color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
.app{display:flex;min-height:100vh}
.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:11px;cursor:pointer;min-width:0}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent);background:var(--accent-soft)}
.nav .brand{display:none}
main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
header.top h1{font-size:24px;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:13px}
.saved{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.saved i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
@media (min-width:820px){
  .nav{position:sticky;top:0;height:100vh;width:196px;flex:none;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:18px 12px;gap:4px;align-items:stretch}
  .nav .brand{display:block;font-weight:700;font-size:17px;padding:4px 10px 16px;letter-spacing:-.01em}
  .nav button{flex:none;flex-direction:row;gap:12px;font-size:14px;padding:10px 12px;justify-content:flex-start}
  main{padding:28px 28px 48px}
}
.card{transition:box-shadow .2s,transform .2s;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-weight:500;color:var(--muted);font-size:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13.5px}
.btn:hover{background:var(--soft)}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#c04fd8));color:var(--accent-fg);border-color:transparent;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn{transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.97)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;min-height:38px}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0;cursor:pointer}
label.f{display:block;font-size:12.5px;color:var(--muted);margin-bottom:10px;font-weight:600}
label.f>*:not(span){margin-top:4px;font-weight:400}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{font-size:12.5px;color:var(--muted);display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.row.done{opacity:.6}
.row input[type=checkbox]{margin-top:2px}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.badge.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.group{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:18px 0 4px}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}
.cd{border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--c) 11%,var(--card));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.cd .n{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.cd .l{font-size:12.5px;color:var(--muted)}
.cd .c{font-weight:700;font-size:13px;color:var(--c)}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:9px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addrow input[type=text]{flex:2 1 160px}
.addrow select,.addrow input[type=time]{flex:1 1 100px}
.daynav{display:flex;align-items:center;gap:8px}
.daynav b{min-width:116px;text-align:center}
table.gt{width:100%;border-collapse:collapse;font-size:14px}
table.gt th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:4px 6px}
table.gt td{padding:4px 6px;vertical-align:middle}
table.gt input{padding:5px 8px;min-height:32px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.timer{text-align:center;padding:10px 0}
.timer .big{font-size:64px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.timer .mode{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:6px}
.timer .btns{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.flash{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:18px;border-radius:14px;background:var(--soft);font-size:19px;font-weight:600;white-space:pre-wrap}
.flash .ans{font-size:16px;font-weight:500;color:var(--accent)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--fg);padding:20px;width:min(460px,calc(100vw - 24px));max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,10,20,.5)}
dialog h3{margin-bottom:14px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.hide{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#view>*{animation:rise .28s ease both}
#view>*:nth-child(2){animation-delay:.04s}#view>*:nth-child(3){animation-delay:.08s}#view>*:nth-child(4){animation-delay:.12s}
.hero{border-radius:20px;padding:20px 20px 18px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#5b5bd6,#8a4fd6 55%,#d4559e);box-shadow:0 10px 30px rgba(91,91,214,.28)}
.hero .hi{font-size:13px;opacity:.85;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.hero .big{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.2}
.hero .sm{font-size:13.5px;opacity:.92}
.hero .pr{height:8px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:14px;overflow:hidden}
.hero .pr i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s}
.nav button{transition:background .15s,color .15s}
.card h2{letter-spacing:-.005em}
.cd .n{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,var(--fg)));-webkit-background-clip:text;background-clip:text;color:transparent}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.bc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.ev{display:flex;gap:10px;padding:6px 0;align-items:baseline}
.ev .tm{width:104px;flex:none;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.gaps{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gapchip{font-size:12px;padding:3px 10px;border-radius:999px;border:1px dashed color-mix(in srgb,var(--good) 55%,var(--line));color:var(--good);font-weight:600}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main>
    <header class="top">

      <div class="saved" id="saved"><i></i><span>Saved on this device</span></div>

    <div id="view"></div>
  </main>
</div>
<dialog id="dlg"></dialog>

<script>
(()=>{
'use strict';
const KEY='uoa-study-tracker-v1';
const COURSES={

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pDay=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=pDay(s);d.setDate(d.getDate()+n);return ymd(d)};
const dayDiff=(a,b)=>Math.round((pDay(b)-pDay(a))/864e5);
const fmtDay=s=>{const d=pDay(s);return DOW[d.getDay()]+' '+MON[d.getMonth()]+' '+d.getDate()};
const fmtTime=t=>{const a=t.split(':').map(Number);const h=a[0],m=a[1];return ((h%12)||12)+':'+pad(m)+' '+(h>=12?'PM':'AM')};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let uidn=0;const nid=()=>Date.now().toString(36)+(uidn++).toString(36)+Math.random().toString(36).slice(2,5);
const weekStart=(s)=>{const d=pDay(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return ymd(d)};
const fmtMin=m=>{m=Math.round(m);const h=Math.floor(m/60);return h?h+'h '+pad(m%60)+'m':m+'m'};
const pill=c=>{const o=COURSES[c]||COURSES.other;return '<span class="pill" style="--c:'+o.c+'">'+esc(o.n)+'</span>'};
const courseOpts=(sel,list)=>(list||Object.keys(COURSES)).map(k=>'<option value="'+k+'"'+(k===sel?' selected':'')+'>'+COURSES[k].n+'</option>').join('');

/* ---------- grade math ---------- */
function calc(c){
  let gw=0,earned=0,tw=0;
  c.components.forEach(k=>{
    const w=+k.weight||0;tw+=w;
    if(k.mark!==null&&k.mark!==''&&!isNaN(+k.mark)){gw+=w;earned+=w*(+k.mark)/100}
  });
  const rem=tw-gw;
  return {gw,earned,tw,rem,cur:gw>0?earned/gw*100:null,max:earned+rem,need:rem>0?(c.target-earned)/rem*100:null};
}
function letterFor(p){
  const cut=S.settings.cutoffs;
  for(const l of CUT_ORDER){if(p>=cut[l])return l}
  return 'F';
}
function termGPA(){
  let pts=0,cr=0;
  GRADED.forEach(k=>{const c=S.grades[k];if(!c)return;const l=letterFor(+c.expected||0);pts+=LETTER_PTS[l]*(+c.credits||0);cr+=(+c.credits||0)});
  return cr?pts/cr:0;
}

const dDate=d=>d.due.slice(0,10), dTime=d=>d.due.slice(11,16);
function relLabel(d){
  const n=dayDiff(today(),dDate(d));
  if(d.tba)return {t:'TBA',c:''};
  if(n<0)return {t:Math.abs(n)+'d overdue',c:'bad'};
  if(n===0)return {t:'Today',c:'warn'};
  if(n===1)return {t:'Tomorrow',c:'warn'};
  if(n<=3)return {t:'in '+n+'d',c:'warn'};
  return {t:'in '+n+'d',c:''};
}
function dueLine(d){
  if(d.tba)return 'Date TBA';
  return fmtDay(dDate(d))+' · '+fmtTime(dTime(d));
}

function parseQuick(text,baseDay){
  let t=' '+text+' ',course='other',star=false,date=baseDay,time='',rep='';
  const cmap={phys:'phys',physics:'phys',math:'math',engg130:'engg130',statics:'engg130',chem:'chem',engl:'engl',english:'engl',engg100:'engg100'};
  t=t.replace(/\s#(\w+)/i,(m,c)=>{c=c.toLowerCase();if(cmap[c])course=cmap[c];return ' '});
  t=t.replace(/\s!([1-3])\b/,()=>{star=true;return ' '});
  t=t.replace(/\severy (day|weekday|week)\b/i,(m,w)=>{rep=w.toLowerCase();return ' '});
  t=t.replace(/\s(today|tomorrow|tmrw|tonight)\b/i,(m,w)=>{w=w.toLowerCase();date=(w==='tomorrow'||w==='tmrw')?addDays(today(),1):today();if(w==='tonight')time='19:00';return ' '});
  const dn=['sun','mon','tue','wed','thu','fri','sat'];
  t=t.replace(/\s(?:on |next )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues|tue|wed|thurs|thur|thu|fri|sat)\b/i,(m,w)=>{const i=dn.indexOf(w.toLowerCase().slice(0,3));date=addDays(today(),((i-new Date().getDay()+7)%7)||7);return ' '});
  t=t.replace(/\s(?:at )?(\d{1,2})(?::(\d{2}))?\s?(am|pm)\b/i,(m,h,mi,ap)=>{h=(+h%12)+(/pm/i.test(ap)?12:0);time=pad(h)+':'+(mi||'00');return ' '});
  t=t.replace(/\s(?:at )?([01]?\d|2[0-3]):([0-5]\d)\b/,(m,h,mi)=>{time=pad(+h)+':'+mi;return ' '});
  return {text:t.replace(/\s+/g,' ').trim(),course,star,date,time,rep};
}
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');

function exportICS(){

  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');

    al.forEach(a=>out.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(sum),'TRIGGER:'+a,'END:VALARM'));

  };

  S.deadlines.filter(d=>!d.done&&!d.tba&&dDate(d)>=t0).forEach(d=>{
    const a=new Date(d.due),dur=d.type==='exam'?120:d.type==='lab'?110:30;

  });
  out.push('END:VCALENDAR');
  const blob=new Blob([out.join('\r\n')],{type:'text/calendar'});

}

  if(T.mode==='focus'){S.sessions.push({id:nid(),course:T.course,min:T.focusMin,at:new Date().toISOString()});T.mode='break';T.remaining=T.breakMin*60}
  else{T.mode='focus';T.remaining=T.focusMin*60}
  T.running=false;T.endAt=0;save();beep();render();
}

/* ---------- dialogs ---------- */
function fieldHTML(f,v){
  const name=' name="'+f.k+'"';
  let inp;
  if(f.type==='select')inp='<select'+name+'>'+f.opts.map(o=>{const val=Array.isArray(o)?o[0]:o,lab=Array.isArray(o)?o[1]:o;return '<option value="'+esc(val)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(lab)+'</option>'}).join('')+'</select>';
  else if(f.type==='textarea')inp='<textarea'+name+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+'>'+esc(v)+'</textarea>';
  else inp='<input type="'+(f.type||'text')+'"'+name+' value="'+esc(v)+'"'+(f.req?' required':'')+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+'>';
  return '<label class="f"><span>'+esc(f.label)+'</span>'+inp+'</label>';
}
function openForm(title,fields,vals,onSave,extra){
  const dlg=$('#dlg');
  dlg.innerHTML='<form id="dform"><h3>'+esc(title)+'</h3>'+fields.map(f=>fieldHTML(f,vals[f.k]==null?'':vals[f.k])).join('')+'<div class="actions">'+(extra||'')+'<button type="button" class="btn ghost" data-act="dlg-close">Cancel</button><button class="btn primary">Save</button></div></form>';
  dlg.showModal();
  $('#dform').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),o={};fields.forEach(f=>{o[f.k]=fd.get(f.k)});dlg.close();onSave(o)};
}
const DL_FIELDS=[{k:'title',label:'Title',req:true},{k:'course',label:'Course',type:'select',opts:Object.keys(COURSES).map(k=>[k,COURSES[k].n])},{k:'type',label:'Type',type:'select',opts:[['assign','Assignment'],['quiz','Quiz'],['exam','Exam'],['lab','Lab'],['other','Other']]},{k:'due',label:'Due',type:'datetime-local',req:true},{k:'finish',label:'My finish-by date (optional)',type:'date'},{k:'weight',label:'Weight (optional)',ph:'e.g. 1%'},{k:'notes',label:'Notes',type:'textarea'}];

/* ---------- actions ---------- */
const byId=(arr,id)=>arr.find(x=>x.id===id);
function act(a,el){
  const id=el.dataset.id,k=el.dataset.k;
  switch(a){
    case 'tab':S.ui.tab=k;review=null;save();render();window.scrollTo(0,0);break;
    case 'welcome-x':S.ui.welcome=false;save();render();break;
    case 'day-prev':viewDay=addDays(viewDay,-1);render();break;
    case 'day-next':viewDay=addDays(viewDay,1);render();break;
    case 'task-del':S.tasks=S.tasks.filter(t=>t.id!==id);save();render();break;
    case 'dl-filter':S.ui.filter=k;save();render();break;
    case 'dl-add':openForm('Add deadline',DL_FIELDS,{course:'math',type:'assign',due:addDays(today(),1)+'T23:59'},o=>{S.deadlines.push({id:nid(),course:o.course,title:o.title.trim(),type:o.type,due:o.due,finish:o.finish||'',weight:o.weight||'',notes:o.notes||'',tba:false,done:false});save();render()});break;
    case 'dl-edit':{const d=byId(S.deadlines,id);openForm('Edit deadline',DL_FIELDS,d,o=>{Object.assign(d,{course:o.course,title:o.title.trim(),type:o.type,due:o.due,finish:o.finish||'',weight:o.weight||'',notes:o.notes||'',tba:false});save();render()},'<button type="button" class="btn danger" data-act="dl-del" data-id="'+id+'">Delete</button>');break}
    case 'dl-del':S.deadlines=S.deadlines.filter(d=>d.id!==id);$('#dlg').close();save();render();break;
    case 'dlg-close':$('#dlg').close();break;
    case 'g-add':{const c=S.grades[k];openForm('Add component',[{k:'name',label:'Name',req:true},{k:'weight',label:'Weight %',type:'number',req:true},{k:'mark',label:'Your mark % (blank if not graded)',type:'number'}],{},o=>{c.components.push(K(o.name.trim(),+o.weight||0,o.mark===''?null:+o.mark));save();render()});break}
    case 'g-del':S.grades[k].components=S.grades[k].components.filter(p=>p.id!==id);save();render();break;
    case 't-toggle':{const T=S.timer;if(T.running){T.remaining=Math.max(1,Math.ceil((T.endAt-Date.now())/1000));T.running=false}else{T.endAt=Date.now()+T.remaining*1000;T.running=true}save();render();break}
    case 't-reset':{const T=S.timer;T.running=false;T.remaining=(T.mode==='focus'?T.focusMin:T.breakMin)*60;save();render();break}
    case 't-skip':{const T=S.timer;T.running=false;T.mode=T.mode==='focus'?'break':'focus';T.remaining=(T.mode==='focus'?T.focusMin:T.breakMin)*60;save();render();break}
    case 'sess-del':S.sessions=S.sessions.filter(s=>s.id!==id);save();render();break;
    case 'card-add':openForm('Add flashcard',[{k:'course',label:'Course',type:'select',opts:Object.keys(COURSES).map(c=>[c,COURSES[c].n])},{k:'front',label:'Front (question or term)',type:'textarea',req:true},{k:'back',label:'Back (answer)',type:'textarea',req:true}],{course:'math'},o=>{S.cards.push({id:nid(),course:o.course,front:o.front.trim(),back:o.back.trim(),box:0,due:today()});save();render()});break;
    case 'card-bulk':openForm('Bulk add cards',[{k:'course',label:'Course',type:'select',opts:Object.keys(COURSES).map(c=>[c,COURSES[c].n])},{k:'text',label:'One card per line: question :: answer',type:'textarea',ph:'Ratio test :: limit of |a(n+1)/a(n)|; <1 converges, >1 diverges'}],{course:'math'},o=>{let n=0;String(o.text).split('\n').forEach(l=>{const p=l.split('::');if(p.length>=2&&p[0].trim()&&p.slice(1).join('::').trim()){S.cards.push({id:nid(),course:o.course,front:p[0].trim(),back:p.slice(1).join('::').trim(),box:0,due:today()});n++}});save();render()});break;
    case 'card-del':S.cards=S.cards.filter(c=>c.id!==id);save();render();break;
    case 'rv-start':{const q=S.cards.filter(c=>c.due<=today()).map(c=>c.id);for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}review={queue:q,i:0,show:false,got:0,missed:0};render();break}
    case 'rv-show':review.show=true;render();break;
    case 'rv-got':{const c=byId(S.cards,review.queue[review.i]);c.box=Math.min(5,c.box+1);c.due=addDays(today(),[0,1,2,4,7,14][c.box]);review.got++;review.i++;review.show=false;save();render();break}
    case 'rv-miss':{const id2=review.queue[review.i];const c=byId(S.cards,id2);c.box=1;c.due=addDays(today(),1);review.missed++;review.i++;review.show=false;save();render();break}
    case 'rv-end':review=null;render();break;
    case 'err-add':openErr({course:'math',kind:'concept'},null);break;
    case 'err-edit':openErr(byId(S.errors,id),id);break;
    case 'err-del':S.errors=S.errors.filter(e=>e.id!==id);save();render();break;
    case 'err-ok':{const e=byId(S.errors,id);const gaps=[2,7,14];e.stage=(e.stage||0)+1;if(e.stage>=gaps.length+1){e.done=true}else{e.next=addDays(today(),gaps[e.stage-1]||14)}save();render();break}
    case 'err-again':{const e=byId(S.errors,id);e.stage=0;e.next=addDays(today(),1);save();render();break}
    case 'sub':S.ui.sub=k;review=null;save();render();break;
    case 'dl-view':S.ui.view=k;save();render();break;
    case 'dl-move':{const d=byId(S.deadlines,id);if(k==='fwd'){if(d.doing){d.doing=false;d.done=true}else if(!d.done){d.doing=true}}else{if(d.done){d.done=false;d.doing=true}else if(d.doing)d.doing=false}save();render();break}
    case 'task-star':{const t=byId(S.tasks,id);t.star=!t.star;save();render();break}
    case 'wk-prev':S.ui.weekOff--;save();render();break;
    case 'wk-next':S.ui.weekOff++;save();render();break;
    case 'wk-now':S.ui.weekOff=0;save();render();break;
    case 'note-add':openForm('New note',NOTE_F,{course:'math'},o=>{S.notes.push({id:nid(),course:o.course,title:o.title.trim(),body:o.body||'',at:new Date().toISOString()});save();render()});break;
    case 'note-edit':{const n=byId(S.notes,id);openForm('Edit note',NOTE_F,n,o=>{Object.assign(n,{course:o.course,title:o.title.trim(),body:o.body||'',at:new Date().toISOString()});save();render()},'<button type="button" class="btn danger" data-act="note-del" data-id="'+id+'">Delete</button>');break}
    case 'note-del':S.notes=S.notes.filter(n=>n.id!==id);$('#dlg').close();save();render();break;
    case 'ics':exportICS();break;
    case 'export':doExport();break;
    case 'reset':if(confirm('Erase everything in this tracker on this device? Export a backup first if you want to keep it.')){try{localStorage.removeItem(KEY)}catch(e){}S=defaults();save();render()}break;
  }
}
function openErr(vals,id){
  openForm(id?'Edit mistake':'Log a mistake',[{k:'course',label:'Course',type:'select',opts:Object.keys(COURSES).map(c=>[c,COURSES[c].n])},{k:'topic',label:'Topic or problem type',req:true,ph:'e.g. induction step, truss method of joints'},{k:'kind',label:'Why it happened',type:'select',opts:['concept','algebra','time','memory']},{k:'what',label:'What went wrong',type:'textarea'},{k:'fix',label:'The fix / correct method',type:'textarea'}],vals,o=>{
    if(id){Object.assign(byId(S.errors,id),o)}
    else S.errors.push({id:nid(),course:o.course,topic:o.topic.trim(),kind:o.kind,what:o.what||'',fix:o.fix||'',stage:0,next:addDays(today(),2),done:false,created:today()});
    save();render();
  });
}
function doExport(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='study-tracker-backup-'+today()+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function chg(a,el){
  const id=el.dataset.id,k=el.dataset.k,v=el.value;
  switch(a){
    case 'task-toggle':byId(S.tasks,id).done=el.checked;break;
    case 'habit':{const h=S.habits[viewDay]||(S.habits[viewDay]={});h[k]=el.checked;break}
    case 'dl-toggle':{const d=byId(S.deadlines,id);d.done=el.checked;if(d.done)d.doing=false;break}
    case 'note-q':S.ui.q=v;break;
    case 'dl-hide':S.ui.hideDone=el.checked;break;
    case 'g-exp':S.grades[k].expected=v===''?0:+v;break;
    case 'g-cr':S.grades[k].credits=v===''?0:+v;break;
    case 'g-w':byId(S.grades[k].components,id).weight=v===''?0:+v;break;
    case 'g-m':byId(S.grades[k].components,id).mark=v===''?null:+v;break;
    case 'g-target':S.grades[k].target=v===''?0:+v;break;
    case 't-course':S.timer.course=v;break;
    case 't-focus':S.timer.focusMin=+v;if(S.timer.mode==='focus'&&!S.timer.running)S.timer.remaining=+v*60;break;
    case 't-break':S.timer.breakMin=+v;if(S.timer.mode==='break'&&!S.timer.running)S.timer.remaining=+v*60;break;
    case 'set-theme':S.settings.theme=v;break;
    case 'set-gpa':S.settings.targetGPA=+v;break;
    case 'set-goal':S.settings.weeklyGoal=+v||25;break;
    case 'set-cut':S.settings.cutoffs[k]=+v;break;
    case 'import':{
      const f=el.files&&el.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.deadlines||!o.grades)throw 0;localStorage.setItem(KEY,JSON.stringify(o));S=load();save();render();alert('Backup imported.')}catch(e){alert('That file is not a valid backup.')}};
      r.readAsText(f);return;
    }
  }
  save();render();
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='LABEL')return;
  act(el.dataset.act,el);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-chg]');if(!el)return;
  const ae=document.activeElement;
  const sig=ae&&ae.dataset&&ae.dataset.chg?{c:ae.dataset.chg,k:ae.dataset.k,id:ae.dataset.id}:null;
  const y=window.scrollY;
  chg(el.dataset.chg,el);
  if(sig){
    const n=[...document.querySelectorAll('#view [data-chg]')].find(x=>x.dataset.chg===sig.c&&x.dataset.k===sig.k&&x.dataset.id===sig.id);
    if(n&&n.focus){try{n.focus({preventScroll:true})}catch(_){}}
  }
  window.scrollTo(0,y);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;
  e.preventDefault();
  const fd=new FormData(f);
  if(f.dataset.form==='task-add'){
    const raw=String(fd.get('text')).trim(),q=parseQuick(raw,viewDay);
    const course=q.course!=='other'?q.course:(fd.get('course')||'other'),time=q.time||fd.get('time')||'',text=q.text||raw,dates=[];
    if(q.rep){for(let i=0;i<14;i++){const dd=addDays(q.date,i);if(q.rep==='weekday'&&[0,6].indexOf(pDay(dd).getDay())>=0)continue;if(q.rep==='week'&&i%7)continue;dates.push(dd)}}else dates.push(q.date);
    dates.forEach(dd=>S.tasks.push({id:nid(),date:dd,text,course,time,done:false,star:q.star}));
    if(dates.length)viewDay=dates[0];
  }else if(f.dataset.form==='sess-add'){
    S.sessions.push({id:nid(),course:fd.get('course'),min:Math.max(1,+fd.get('min')||0),at:new Date().toISOString()});
  }
  save();render();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.timer.running&&S.timer.endAt<=Date.now())timerDone();else if(!document.hidden)render()});

S=load();
// resume a timer that finished while the page was closed
if(S.timer.running&&S.timer.endAt<=Date.now()){S.timer.running=false;S.timer.remaining=(S.timer.mode==='focus'?S.timer.focusMin:S.timer.breakMin)*60}
save();render();
})();
</script>
